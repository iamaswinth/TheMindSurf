services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2000}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.3}

      # Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}

      # Pinecone Configuration
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_DENSE_INDEX_NAME=${PINECONE_DENSE_INDEX_NAME:-rag-comparator-dense}
      - PINECONE_SPARSE_INDEX_NAME=${PINECONE_SPARSE_INDEX_NAME:-rag-comparator-sparse}
      - PINECONE_CLOUD=${PINECONE_CLOUD:-aws}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-documents}

      # Application Settings
      - APP_NAME=${APP_NAME:-RAG Comparator Backend}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Processing Configuration
      - ENABLE_MULTIMODAL_PROCESSING=${ENABLE_MULTIMODAL_PROCESSING:-true}
      - ENABLE_AI_ENHANCEMENT=${ENABLE_AI_ENHANCEMENT:-true}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}

      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}

    volumes:
      # Optional: Mount logs directory for persistence
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
